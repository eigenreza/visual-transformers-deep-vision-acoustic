[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echolabel"
version = "0.1.0"
description = "Species detection in in-trawl camera imagery, with the data pipeline around it and infrastructure for integration with echosounder data"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "xarray",
  "zarr",
  "dask",
  "distributed",
  "scipy",
  "scikit-learn",
  "pillow",
  "lxml",
  "pyyaml",
  "matplotlib",
  "tqdm",
  "faster-coco-eval",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
torch = ["torch", "torchvision"]

[project.scripts]
echolabel = "echolabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
