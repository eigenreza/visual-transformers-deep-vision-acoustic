__include__:
- <project_dir>/external/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r50vd_6x_coco.yml
output_dir: <scratch_dir>/runs/detector/rtdetrv2_l_1024/seed1/framework
num_classes: 15
remap_mscoco_category: false
eval_spatial_size:
- 1024
- 1024
train_dataloader:
  dataset:
    img_folder: <annotated_data>/images
    ann_file: <project_dir>/runs/dataset/coco/train.json
    transforms:
      ops:
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomIoUCrop
        p: 0.5
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 1024
        - 1024
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch: 34
        ops:
        - RandomPhotometricDistort
        - RandomIoUCrop
  collate_fn:
    type: BatchImageCollateFunction
    stop_epoch: 34
    scales:
    - 768
    - 800
    - 832
    - 864
    - 896
    - 928
    - 960
    - 992
    - 1024
    - 1024
    - 1024
    - 1056
    - 1088
    - 1120
    - 1152
    - 1184
    - 1216
    - 1248
    - 1280
  total_batch_size: 8
  num_workers: 24
  shuffle: true
  drop_last: true
val_dataloader:
  dataset:
    img_folder: <annotated_data>/images
    ann_file: <project_dir>/runs/dataset/coco/val.json
    transforms:
      ops:
      - type: Resize
        size:
        - 1024
        - 1024
      - type: ConvertPILImage
        dtype: float32
        scale: true
  total_batch_size: 8
  num_workers: 24
  shuffle: false
  drop_last: false
epoches: 40
checkpoint_freq: 10
print_freq: 50
use_amp: true
use_ema: true
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*norm).*$
    lr: 1.0e-05
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 1000000
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
PResNet:
  pretrained: false
